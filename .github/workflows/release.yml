name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-channels
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify release version
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          const lock = require('./package-lock.json');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) ||
              process.env.GITHUB_REF_NAME !== `v${version}` ||
              lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('Release requires matching vX.Y.Z tag, package.json and package-lock.json; use the canary dist-tag, not a prerelease version suffix.');
          }
          NODE

      - name: Test release source
        run: npm test

      - name: Verify fixed canvas command runtime
        run: npm run verify:canvas-runtime

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare npm package checksum
        run: |
          test -s dist/checksums.txt
          cp dist/checksums.txt checksums.txt

      - name: Stage fixed canvas command runtime
        run: npm run prepare:canvas-runtime

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish to npm canary
        run: npm publish --provenance --access public --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
