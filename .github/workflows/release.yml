name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Select npm dist-tag
        id: npm_channel
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          case "${version}" in
            *-beta.*)
              dist_tag="beta"
              ;;
            *-*)
              echo "Unsupported prerelease channel in ${version}; only beta releases are publishable" >&2
              exit 1
              ;;
            *)
              dist_tag="latest"
              ;;
          esac
          echo "dist_tag=${dist_tag}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        run: npm test

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare npm package checksum
        run: |
          test -s dist/checksums.txt
          cp dist/checksums.txt checksums.txt

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.npm_channel.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
